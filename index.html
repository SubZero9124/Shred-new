<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Lottie</title>
  <style>
    /* Base Body Styling */
    body {
      margin: 0;
      padding: 0;
      background-color: #313941;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Lottie Safe Space & Responsive Container */
    .lottie-wrapper {
      position: relative;
      width: 100%;
      max-width: 1340px; /* Native width of the composition */
      padding: 0 150px; /* 150px safe space on either side */
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    .lottie-container {
      position: relative;
      width: 100%;
      max-height: 95vh;
      aspect-ratio: 1340 / 2738; /* Match native composition aspect ratio */
    }

    #lottie-el {
      width: 100%;
      height: 100%;
      user-select: none; /* Prevents accidental highlighting while dragging */
    }

    /* This targets the EXACT SVG group layer for Rectangle 10 
      because we injected this class name into the JSON 
    */
    .drag-target-layer {
      cursor: grab;
      touch-action: none; /* Prevents screen scrolling when dragging the element on mobile */
      pointer-events: auto;
    }

    .drag-target-layer.dragging {
      cursor: grabbing;
    }

    /* Bottom Right Refresh Icon */
    .refresh-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      transition: background-color 0.2s ease;
      z-index: 100;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .refresh-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @media (max-width: 768px) {
      .lottie-wrapper {
        padding: 0 20px; 
      }
    }
  </style>
</head>

    // Inject a CSS class directly into "Rectangle 10" in the JSON before loading.
    // Lottie generates SVG <g> tags. Setting "cl" forces that specific group to have this CSS class.
    if (animationData.layers) {
      const targetLayer = animationData.layers.find(layer => layer.nm === "Rectangle 10");
      if (targetLayer) {
        targetLayer.cl = "drag-target-layer";
      }
    }

    // Initialize Lottie
    const anim = lottie.loadAnimation({
      container: document.getElementById('lottie-el'),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: animationData
    });

    const refreshBtn = document.getElementById('refresh-btn');
    
    const fps = 24; 
    const targetSecond = 1.05; 
    const targetFrame = Math.round(targetSecond * fps); // ~25 frames
    const totalFrames = 59; 
    
    let isDragging = false;
    let startY = 0;
    let currentFrame = 0;
    let baseFrame = 0;
    let hasPlayedRest = false;
    let dragElement = null;

    const pixelsPerFrame = 8; 

    // Once DOM is fully rendered by Lottie, fetch our targeted SVG shape
    anim.addEventListener('DOMLoaded', () => {
      anim.goToAndStop(0, true);
      
      // Because we injected 'cl' into the JSON, this finds the EXACT SVG <g> tag that makes Rectangle 10!
      dragElement = document.querySelector('.drag-target-layer');

      if (dragElement) {
        // Only attach the drag START to the graphic itself
        dragElement.addEventListener('mousedown', handleDragStart);
        dragElement.addEventListener('touchstart', handleDragStart, { passive: true });
      }
    });

    const handleDragStart = (e) => {
      if (hasPlayedRest) return;
      isDragging = true;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      baseFrame = currentFrame;
      
      if(dragElement) dragElement.classList.add('dragging');
    };

    const handleDragMove = (e) => {
      if (!isDragging || hasPlayedRest) return;

      const currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const deltaY = currentY - startY;

      // Only scrub forward if dragging down
      if (deltaY > 0) {
        const additionalFrames = Math.floor(deltaY / pixelsPerFrame);
        const newFrame = baseFrame + additionalFrames;

        // Strictly prevent reverse playback

          currentFrame = newFrame;
          
          if (currentFrame >= targetFrame) {
            // Threshold reached, auto-play the rest
            isDragging = false;
            hasPlayedRest = true;
            if(dragElement) dragElement.classList.remove('dragging');
            anim.playSegments([currentFrame, totalFrames], true);
          } else {
            // Scrub timeline
            anim.goToAndStop(currentFrame, true);
          }
        }
      }
    };

    const handleDragEnd = () => {
      if (isDragging) {
        isDragging = false;
        if(dragElement) dragElement.classList.remove('dragging');
      }
    };

    const handleReset = () => {
      isDragging = false;
      hasPlayedRest = false;
      currentFrame = 0;
      baseFrame = 0;
      if(dragElement) dragElement.classList.remove('dragging');
      anim.resetSegments(true); // Reset the timeline segments
      anim.goToAndStop(0, true);

    document.addEventListener('touchmove', handleDragMove, { passive: false }); 
    document.addEventListener('touchend', handleDragEnd);
